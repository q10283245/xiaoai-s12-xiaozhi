name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install native mock dependencies
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libopus-dev libjson-c-dev
      - name: Run offline tests and publication guard
        run: make test
      - name: Cross compile transport bridge
        working-directory: bridge
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w -buildid=' -o /tmp/s12-bridge.arm .
